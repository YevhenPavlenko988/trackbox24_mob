name: trackbox24_mob
description: "TrackBox24 — мобільний застосунок представника й водія (сканування посилок, рейси, офлайн-черга)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1F6FEB"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#1F6FEB"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#1F6FEB"
    image: assets/icon/icon_foreground.png
